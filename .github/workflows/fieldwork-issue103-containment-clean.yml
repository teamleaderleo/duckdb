name: Fieldwork issue 103 clean containment

on:
  push:
    branches:
      - fieldwork/103-s3-interrupt-containment-clean
    paths:
      - .github/patches/extensions/httpfs/issue103-interrupt-containment.patch
      - .github/config/extensions/httpfs.cmake
      - .github/workflows/fieldwork-issue103-containment-clean.yml
  pull_request:
    paths:
      - .github/patches/extensions/httpfs/issue103-interrupt-containment.patch
      - .github/config/extensions/httpfs.cmake
      - .github/workflows/fieldwork-issue103-containment-clean.yml
  workflow_dispatch:

concurrency:
  group: fieldwork-issue103-clean-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  containment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair generated HTTPFS patch metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/patches/extensions/httpfs/issue103-interrupt-containment.patch')
          text = path.read_text(encoding='utf-8')
          old_includes = '''@@ -12,11 +12,13 @@
 #include "duckdb/common/file_system.hpp"
 #include "duckdb/common/string_util.hpp"
 #include "duckdb/main/client_context.hpp"
 #include "duckdb/main/extension/extension_loader.hpp"
 #include "duckdb/main/secret/secret.hpp"
 
 #include <array>
 #include <atomic>
+#include <future>
 #include <mutex>
 #include <new>
+#include <thread>
 #include <unordered_map>
'''
          new_includes = '''@@ -21,0 +22,2 @@
+#include <future>
+#include <thread>
'''
          if text.count(old_includes) != 1:
              raise SystemExit('containment include hunk changed')
          text = text.replace(old_includes, new_includes, 1)
          old_tail = '@@ -947,6 +949,140 @@'
          new_tail = '@@ -947,6 +949,142 @@'
          if text.count(old_tail) != 1:
              raise SystemExit('containment tail hunk changed')
          path.write_text(text.replace(old_tail, new_tail, 1), encoding='utf-8')
          PY

      - name: Install build dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ninja-build mold libcurl4-openssl-dev libssl-dev

      - name: Configure DuckDB with pinned HTTPFS
        run: |
          cmake -S . -B build/issue103-clean -G Ninja \
            -DFORCE_COLORED_OUTPUT=1 \
            -DDUCKDB_EXTENSION_CONFIGS=.github/config/extensions/httpfs.cmake \
            '-DBUILD_EXTENSIONS=;parquet' \
            -DDEBUG_MOVE=1 \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build focused HTTPFS unit test
        run: cmake --build build/issue103-clean --target unittest_httpfs --parallel 2

      - name: Run clean containment regression
        run: |
          ./build/issue103-clean/test/unittest_httpfs \
            "HTTPFS contains S3 multipart publication during interrupted teardown" \
            2>&1 | tee issue103-clean-containment.log
          printf '{"clean_containment_passed":true}\n' > issue103-clean-containment-summary.json

      - name: Upload clean containment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldwork-issue103-clean-containment
          path: |
            issue103-clean-containment.log
            issue103-clean-containment-summary.json
          if-no-files-found: warn
          retention-days: 30
