name: Fieldwork issue 103 clean containment

on:
  push:
    branches:
      - fieldwork/103-s3-interrupt-containment-clean
    paths:
      - .github/patches/extensions/httpfs/0001-remove-pessimizing-move.patch
      - .github/patches/extensions/httpfs/issue103-interrupt-containment.patch
      - .github/workflows/fieldwork-issue103-containment-clean.yml
  pull_request:
    paths:
      - .github/patches/extensions/httpfs/0001-remove-pessimizing-move.patch
      - .github/patches/extensions/httpfs/issue103-interrupt-containment.patch
      - .github/workflows/fieldwork-issue103-containment-clean.yml
  workflow_dispatch:

concurrency:
  group: fieldwork-issue103-clean-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HTTPFS_COMMIT: df92a34d29eb589591adfadba89fa8df874e54ea

jobs:
  containment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage pinned HTTPFS candidate
        run: |
          set -euxo pipefail
          mkdir -p .fieldwork/httpfs
          git -C .fieldwork/httpfs init
          git -C .fieldwork/httpfs remote add origin https://github.com/duckdb/duckdb-httpfs.git
          git -C .fieldwork/httpfs fetch --depth=1 origin "$HTTPFS_COMMIT"
          git -C .fieldwork/httpfs checkout --detach FETCH_HEAD

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/patches/extensions/httpfs/issue103-interrupt-containment.patch')
          text = path.read_text(encoding='utf-8')
          old = (
              '@@ -564,4 +597,12 @@ void MockS3Server::ReleaseFullGet() {\n'
              ' \timpl->ReleaseFullGet();\n'
              ' }\n'
              '+\n'
              '+bool MockS3Server::WaitForMultipartPart() {\n'
              '+\treturn impl->WaitForMultipartPart();\n'
              '+}\n'
              '+\n'
              '+void MockS3Server::ReleaseMultipartPart() {\n'
              '+\timpl->ReleaseMultipartPart();\n'
              '+}\n'
              ' \n'
              ' } // namespace duckdb\n'
          )
          new = (
              '@@ -566,4 +599,12 @@ void MockS3Server::ReleaseFullGet() {\n'
              ' \timpl->ReleaseFullGet();\n'
              ' }\n'
              '+\n'
              '+bool MockS3Server::WaitForMultipartPart() {\n'
              '+\treturn impl->WaitForMultipartPart();\n'
              '+}\n'
              '+\n'
              '+void MockS3Server::ReleaseMultipartPart() {\n'
              '+\timpl->ReleaseMultipartPart();\n'
              '+}\n'
              ' \n'
              ' string MockS3RefreshTargetName(MockS3RefreshTarget target) {\n'
          )
          if text.count(old) != 1:
              raise SystemExit('containment mock footer hunk changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          for patch in \
            .github/patches/extensions/httpfs/0001-remove-pessimizing-move.patch \
            .github/patches/extensions/httpfs/issue103-interrupt-containment.patch
          do
            git -C .fieldwork/httpfs apply --check --recount "$GITHUB_WORKSPACE/$patch"
            git -C .fieldwork/httpfs apply --recount "$GITHUB_WORKSPACE/$patch"
          done
          git -C .fieldwork/httpfs diff --check

          cat > .fieldwork/httpfs-local.cmake <<'CMAKE'
          duckdb_extension_load(httpfs
              LOAD_TESTS
              SOURCE_DIR "${CMAKE_CURRENT_LIST_DIR}/httpfs"
              EXTENSION_VERSION df92a34d29eb589591adfadba89fa8df874e54ea
          )
          CMAKE

      - name: Install build dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ninja-build mold libcurl4-openssl-dev libssl-dev

      - name: Configure DuckDB with staged HTTPFS
        run: |
          cmake -S . -B build/issue103-clean -G Ninja \
            -DFORCE_COLORED_OUTPUT=1 \
            -DDUCKDB_EXTENSION_CONFIGS="$GITHUB_WORKSPACE/.fieldwork/httpfs-local.cmake" \
            '-DBUILD_EXTENSIONS=;parquet' \
            -DDEBUG_MOVE=1 \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build focused HTTPFS unit test
        run: cmake --build build/issue103-clean --target unittest_httpfs --parallel 2

      - name: Run clean containment regression
        run: |
          ./build/issue103-clean/test/unittest_httpfs \
            "HTTPFS contains S3 multipart publication during interrupted teardown" \
            2>&1 | tee issue103-clean-containment.log
          printf '{"clean_containment_passed":true}\n' > issue103-clean-containment-summary.json

      - name: Upload clean containment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldwork-issue103-clean-containment
          path: |
            issue103-clean-containment.log
            issue103-clean-containment-summary.json
          if-no-files-found: warn
          retention-days: 30
