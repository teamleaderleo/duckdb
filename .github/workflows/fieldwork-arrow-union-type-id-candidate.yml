name: Fieldwork Arrow union nested-offset characterization

on:
  pull_request:
    paths:
      - '.github/workflows/fieldwork-arrow-union-type-id-candidate.yml'
      - 'tools/fieldwork/apply_arrow_union_type_id_mapping.py'
      - 'tools/fieldwork/apply_arrow_union_type_id_hardening.py'
      - 'test/arrow/CMakeLists.txt'
      - 'test/arrow/arrow_union_type_ids.cpp'

permissions:
  contents: read

concurrency:
  group: fieldwork-arrow-union-nested-offset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact characterization identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PARENT_SHA: c962ece64c1356015aef15a37c0cc636f63b376b
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGED: ${{ runner.temp }}/carrier-files.txt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$BASE_SHA" = "$EXPECTED_PARENT_SHA"
          python -m py_compile \
            tools/fieldwork/apply_arrow_union_type_id_mapping.py \
            tools/fieldwork/apply_arrow_union_type_id_hardening.py
          git diff --name-only "$BASE_SHA"...HEAD | sort > "$CHANGED"
          cat > "${{ runner.temp }}/expected-carrier-files.txt" <<'EOF'
          .github/workflows/fieldwork-arrow-union-type-id-candidate.yml
          test/arrow/arrow_union_type_ids.cpp
          tools/fieldwork/apply_arrow_union_type_id_hardening.py
          EOF
          diff -u "${{ runner.temp }}/expected-carrier-files.txt" "$CHANGED"
          test -z "$(git status --porcelain)"
          printf 'tested_sha=%s\n' "$EXPECTED_SHA"

      - name: Generate pre-repair source candidate
        env:
          PATCH: ${{ runner.temp }}/arrow-union-type-id-pre-nested-offset.patch
          SOURCE_FILES: ${{ runner.temp }}/source-files.txt
          SOURCE_BUNDLE: ${{ runner.temp }}/generated-source
          COUNTS: ${{ runner.temp }}/candidate-generation.txt
        run: |
          set -euo pipefail
          python tools/fieldwork/apply_arrow_union_type_id_mapping.py | tee "$COUNTS"
          python tools/fieldwork/apply_arrow_union_type_id_hardening.py | tee -a "$COUNTS"
          git diff --check
          git diff --name-only | sort > "$SOURCE_FILES"
          cat > "${{ runner.temp }}/expected-source-files.txt" <<'EOF'
          src/common/enum_util.cpp
          src/function/table/arrow.cpp
          src/function/table/arrow/arrow_duck_schema.cpp
          src/function/table/arrow/arrow_type_info.cpp
          src/function/table/arrow_conversion.cpp
          src/include/duckdb/function/table/arrow/arrow_type_info.hpp
          src/include/duckdb/function/table/arrow/enum/arrow_type_info_type.hpp
          EOF
          diff -u "${{ runner.temp }}/expected-source-files.txt" "$SOURCE_FILES"
          git diff -- $(cat "$SOURCE_FILES") > "$PATCH"
          test -s "$PATCH"
          mkdir -p "$SOURCE_BUNDLE"
          cp --parents $(cat "$SOURCE_FILES") "$SOURCE_BUNDLE"
          grep -F 'FIELDWORK_262_PATCH=arrow-union-type-id-mapping' "$COUNTS"
          grep -F 'FIELDWORK_262_HARDENING=nonnegative-type-id-duplicate-rejection' "$COUNTS"
          grep -F 'FIELDWORK_262_REPAIR=union-child-parent-offset' "$COUNTS"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold ninja-build

      - name: Build debug test runner with pre-repair candidate
        run: GEN=ninja make debug

      - name: Run established positive controls
        run: |
          build/debug/test/unittest "Arrow sparse union maps identity type IDs"
          build/debug/test/unittest "Arrow sparse union maps non-sequential type IDs"
          build/debug/test/unittest "Arrow sparse union maps reordered in-range type IDs"
          build/debug/test/unittest "Arrow sparse union maps upper-bound type IDs"
          build/debug/test/unittest "Arrow sparse union mapping honors a nonzero parent offset"

      - name: Characterize nested sparse-union offset
        run: build/debug/test/unittest "Arrow sparse union mapping honors its offset when nested in a fixed-size list"

      - name: Retain exact characterization patch and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arrow-union-nested-offset-characterization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/arrow-union-type-id-pre-nested-offset.patch
            ${{ runner.temp }}/candidate-generation.txt
            ${{ runner.temp }}/carrier-files.txt
            ${{ runner.temp }}/source-files.txt
            ${{ runner.temp }}/generated-source
          if-no-files-found: warn
          retention-days: 14
