name: Fieldwork Arrow union type-ID candidate

on:
  pull_request:
    paths:
      - '.github/workflows/fieldwork-arrow-union-type-id-candidate.yml'
      - 'tools/fieldwork/apply_arrow_union_type_id_mapping.py'
      - 'test/arrow/CMakeLists.txt'
      - 'test/arrow/arrow_union_type_ids.cpp'

permissions:
  contents: read

concurrency:
  group: fieldwork-arrow-union-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact carrier identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGED: ${{ runner.temp }}/carrier-files.txt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/fieldwork/apply_arrow_union_type_id_mapping.py
          git diff --name-only "$BASE_SHA"...HEAD | sort > "$CHANGED"
          grep -Fx '.github/workflows/fieldwork-arrow-union-type-id-candidate.yml' "$CHANGED"
          grep -Fx '.github/workflows/fieldwork-arrow-union-type-id-characterization.yml' "$CHANGED"
          grep -Fx 'test/arrow/CMakeLists.txt' "$CHANGED"
          grep -Fx 'test/arrow/arrow_union_type_ids.cpp' "$CHANGED"
          grep -Fx 'tools/fieldwork/apply_arrow_union_type_id_mapping.py' "$CHANGED"
          test "$(wc -l < "$CHANGED")" -eq 5
          test -z "$(git status --porcelain)"
          printf 'tested_sha=%s\n' "$EXPECTED_SHA"

      - name: Generate exact source candidate
        env:
          PATCH: ${{ runner.temp }}/arrow-union-type-id.patch
          SOURCE_FILES: ${{ runner.temp }}/source-files.txt
          COUNTS: ${{ runner.temp }}/candidate-generation.txt
        run: |
          set -euo pipefail
          python tools/fieldwork/apply_arrow_union_type_id_mapping.py | tee "$COUNTS"
          git diff --check
          git diff --name-only | sort > "$SOURCE_FILES"
          cat > "${{ runner.temp }}/expected-source-files.txt" <<'EOF'
          src/common/enum_util.cpp
          src/function/table/arrow.cpp
          src/function/table/arrow/arrow_duck_schema.cpp
          src/function/table/arrow/arrow_type_info.cpp
          src/function/table/arrow_conversion.cpp
          src/include/duckdb/function/table/arrow/arrow_type_info.hpp
          src/include/duckdb/function/table/arrow/enum/arrow_type_info_type.hpp
          EOF
          diff -u "${{ runner.temp }}/expected-source-files.txt" "$SOURCE_FILES"
          git diff -- $(cat "$SOURCE_FILES") > "$PATCH"
          test -s "$PATCH"
          grep -F 'FIELDWORK_262_PATCH=arrow-union-type-id-mapping' "$COUNTS"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold ninja-build

      - name: Build debug test runner with candidate
        run: GEN=ninja make debug

      - name: Run non-sequential mapping regression
        run: |
          build/debug/test/unittest \
            "Arrow sparse union maps non-sequential type IDs"

      - name: Run reordered in-range mapping regression
        run: |
          build/debug/test/unittest \
            "Arrow sparse union maps reordered in-range type IDs"

      - name: Retain exact generated patch and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arrow-union-type-id-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/arrow-union-type-id.patch
            ${{ runner.temp }}/candidate-generation.txt
            ${{ runner.temp }}/carrier-files.txt
            ${{ runner.temp }}/source-files.txt
          if-no-files-found: warn
          retention-days: 14
