name: Fieldwork secondary ART source repair

on:
  pull_request:
    paths:
      - '.github/workflows/fieldwork-secondary-art-source-repair.yml'
      - 'tools/fieldwork/resolve_duckdb_shared_library.py'
      - 'tools/fieldwork/test_resolve_duckdb_shared_library.py'
      - 'tools/fieldwork/secondary_art_persistence_trigger_probe.py'
      - 'tools/fieldwork/secondary_art_source_identity_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-packaging-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_id: v1.4.0
            source_ref: v1.4.0
            expected_probe_status: 0
          - case_id: art-builder-parent
            source_ref: 22e6d1e3751829d2d029636b75ff931710ca7cbc^
            expected_probe_status: -1
          - case_id: art-builder
            source_ref: 22e6d1e3751829d2d029636b75ff931710ca7cbc
            expected_probe_status: -1
    env:
      CASE_ID: ${{ matrix.case_id }}
      SOURCE_REF: ${{ matrix.source_ref }}
      EXPECTED_PROBE_STATUS: ${{ matrix.expected_probe_status }}
      ROW_COUNT: '2'
    steps:
      - name: Check out controlled fork carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Run resolver controls
        run: |
          python -m unittest \
            tools.fieldwork.test_resolve_duckdb_shared_library

      - name: Resolve exact public source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if ! git remote get-url public >/dev/null 2>&1; then
            git remote add public https://github.com/duckdb/duckdb.git
          fi
          git fetch --force --tags public \
            '+refs/heads/main:refs/remotes/public/main'
          source_sha=$(git rev-parse "${SOURCE_REF}^{commit}")
          source_dir="$RUNNER_TEMP/duckdb-source-$CASE_ID"
          git worktree add --detach "$source_dir" "$source_sha"
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_dir=%s\n' "$source_dir"
          } >>"$GITHUB_OUTPUT"
          python - "$CASE_ID" "$SOURCE_REF" "$source_sha" <<'PY' \
            | tee "source-$CASE_ID.json"
          import json
          import sys

          print(
              json.dumps(
                  {
                      "schema_version": 1,
                      "case_id": sys.argv[1],
                      "requested_ref": sys.argv[2],
                      "source_sha": sys.argv[3],
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Build and copy one exact library into two engine images
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        run: |
          set -euo pipefail
          make -C "$SOURCE_DIR" release GEN=ninja DISABLE_SHELL=1
          runtime="$RUNNER_TEMP/dual-engine-$CASE_ID"
          python tools/fieldwork/resolve_duckdb_shared_library.py \
            "$SOURCE_DIR" \
            --copy-to "$runtime/writer/libduckdb.so" \
            --copy-to "$runtime/trigger/libduckdb.so" \
            --output "library-resolution-$CASE_ID.json" \
            >"library-resolution-$CASE_ID.stdout"
          writer_identity=$(stat -c '%d:%i' "$runtime/writer/libduckdb.so")
          trigger_identity=$(stat -c '%d:%i' "$runtime/trigger/libduckdb.so")
          if [[ $writer_identity == "$trigger_identity" ]]; then
            echo 'copied libraries unexpectedly share one inode' >&2
            exit 2
          fi
          sha256sum \
            "$runtime/writer/libduckdb.so" \
            "$runtime/trigger/libduckdb.so" \
            | tee "libraries-$CASE_ID.sha256"
          printf '%s\n' "$runtime" >"runtime-$CASE_ID.txt"

      - name: Run same-source dual-engine persistence probe
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          runtime=$(cat "runtime-$CASE_ID.txt")
          database="$PWD/secondary-art-source-$CASE_ID.duckdb"
          set +e
          python tools/fieldwork/secondary_art_source_identity_probe.py create \
            "$runtime/writer/libduckdb.so" \
            "$runtime/trigger/libduckdb.so" \
            "$database" \
            "$ROW_COUNT" \
            "$SOURCE_SHA" \
            | tee "create-$CASE_ID.json"
          status=${PIPESTATUS[0]}
          set -e
          printf 'probe_status=%s\n' "$status" \
            | tee "probe-status-$CASE_ID.txt"
          if [[ $status -ne 0 && $status -ne 1 ]]; then
            echo "source-identity probe setup failed with status $status" >&2
            exit "$status"
          fi

      - name: Inspect persisted file in a fresh process
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          runtime=$(cat "runtime-$CASE_ID.txt")
          python tools/fieldwork/secondary_art_source_identity_probe.py inspect \
            "$runtime/trigger/libduckdb.so" \
            "$PWD/secondary-art-source-$CASE_ID.duckdb" \
            "$ROW_COUNT" \
            "$SOURCE_SHA" \
            | tee "inspection-$CASE_ID.json"

      - name: Classify repaired historical row
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          case_id = os.environ["CASE_ID"]
          source_sha = os.environ["SOURCE_SHA"]
          row_count = int(os.environ["ROW_COUNT"])
          expected_status = int(os.environ["EXPECTED_PROBE_STATUS"])
          status = int(
              pathlib.Path(f"probe-status-{case_id}.txt")
              .read_text()
              .strip()
              .split("=", 1)[1]
          )
          source = json.loads(pathlib.Path(f"source-{case_id}.json").read_text())
          resolution = json.loads(
              pathlib.Path(f"library-resolution-{case_id}.json").read_text()
          )
          created = json.loads(pathlib.Path(f"create-{case_id}.json").read_text())
          inspection = json.loads(
              pathlib.Path(f"inspection-{case_id}.json").read_text()
          )

          require(source["source_sha"] == source_sha, f"{case_id}: source mismatch")
          require(
              resolution.get("schema_version") == 1
              and resolution.get("link_path", "").endswith(
                  "/build/release/src/libduckdb.so"
              ),
              f"{case_id}: invalid exact library resolution: {resolution}",
          )
          require(
              created.get("source_sha") == source_sha
              and inspection.get("source_sha") == source_sha,
              f"{case_id}: probe source mismatch",
          )
          writer = created["writer_library"]
          trigger = created["checkpointer_library"]
          require(writer["sha256"] == trigger["sha256"], "library bytes differ")
          require(
              (writer["device"], writer["inode"])
              != (trigger["device"], trigger["inode"]),
              "library inodes are not distinct",
          )
          require(
              writer["open_address"] != trigger["open_address"],
              "engine function addresses are not distinct",
          )
          require(type(created.get("wrong_result")) is bool, "wrong_result not bool")
          require(
              status == (0 if created["wrong_result"] else 1),
              "probe status and wrong_result disagree",
          )
          if expected_status >= 0:
              require(status == expected_status, f"expected {expected_status}, got {status}")
          require(
              created["full_count"] == row_count
              and inspection["full_count"] == row_count,
              "full row count changed",
          )
          require(
              inspection["disabled_filtered_count"] == 1
              and inspection["disabled_terminal_count"] == 1,
              "sequential-scan controls failed",
          )
          require(
              inspection["first_values"] == list(range(1, row_count + 1)),
              "ordered values changed",
          )
          summary = {
              "schema_version": 1,
              "case_id": case_id,
              "source_sha": source_sha,
              "probe_status": status,
              "wrong_result": created["wrong_result"],
              "enabled_filtered_count": inspection["enabled_filtered_count"],
              "disabled_filtered_count": inspection["disabled_filtered_count"],
              "library_resolution": resolution,
          }
          pathlib.Path(f"summary-{case_id}.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload repaired historical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secondary-art-source-repair-${{ matrix.case_id }}
          path: |
            source-${{ matrix.case_id }}.json
            library-resolution-${{ matrix.case_id }}.json
            library-resolution-${{ matrix.case_id }}.stdout
            libraries-${{ matrix.case_id }}.sha256
            runtime-${{ matrix.case_id }}.txt
            create-${{ matrix.case_id }}.json
            probe-status-${{ matrix.case_id }}.txt
            inspection-${{ matrix.case_id }}.json
            summary-${{ matrix.case_id }}.json
            secondary-art-source-${{ matrix.case_id }}.duckdb
            secondary-art-source-${{ matrix.case_id }}.duckdb.wal
          if-no-files-found: warn
          retention-days: 14

  current-trigger-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ROW_COUNT: '2'
    steps:
      - name: Check out controlled fork carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Run resolver controls
        run: |
          python -m unittest \
            tools.fieldwork.test_resolve_duckdb_shared_library

      - name: Resolve current public main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if ! git remote get-url public >/dev/null 2>&1; then
            git remote add public https://github.com/duckdb/duckdb.git
          fi
          git fetch --force public \
            '+refs/heads/main:refs/remotes/public/main'
          source_sha=$(git rev-parse refs/remotes/public/main^{commit})
          source_dir="$RUNNER_TEMP/duckdb-current-source"
          git worktree add --detach "$source_dir" "$source_sha"
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_dir=%s\n' "$source_dir"
          } >>"$GITHUB_OUTPUT"
          python - "$source_sha" <<'PY' | tee current-source.json
          import json
          import sys
          print(json.dumps({"schema_version": 1, "requested_ref": "public/main", "source_sha": sys.argv[1]}, sort_keys=True))
          PY

      - name: Build and copy current source into two engine images
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        run: |
          set -euo pipefail
          make -C "$SOURCE_DIR" release GEN=ninja DISABLE_SHELL=1
          runtime="$RUNNER_TEMP/current-trigger-engines"
          python tools/fieldwork/resolve_duckdb_shared_library.py \
            "$SOURCE_DIR" \
            --copy-to "$runtime/writer/libduckdb.so" \
            --copy-to "$runtime/trigger/libduckdb.so" \
            --output current-library-resolution.json \
            >current-library-resolution.stdout
          test "$(stat -c '%d:%i' "$runtime/writer/libduckdb.so")" \
            != "$(stat -c '%d:%i' "$runtime/trigger/libduckdb.so")"
          sha256sum \
            "$runtime/writer/libduckdb.so" \
            "$runtime/trigger/libduckdb.so" \
            | tee current-libraries.sha256
          printf '%s\n' "$runtime" >current-runtime.txt

      - name: Execute four named persistence triggers
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          runtime=$(cat current-runtime.txt)
          for trigger in open-close select-one indexed-read explicit-checkpoint; do
            database="$PWD/secondary-art-trigger-$trigger.duckdb"
            python tools/fieldwork/secondary_art_persistence_trigger_probe.py \
              "$runtime/writer/libduckdb.so" \
              "$runtime/trigger/libduckdb.so" \
              "$database" \
              "$ROW_COUNT" \
              "$SOURCE_SHA" \
              "$trigger" \
              | tee "trigger-$trigger.json"
            python tools/fieldwork/secondary_art_source_identity_probe.py inspect \
              "$runtime/trigger/libduckdb.so" \
              "$database" \
              "$ROW_COUNT" \
              "$SOURCE_SHA" \
              | tee "inspection-$trigger.json"
          done

      - name: Classify trigger ownership without selecting a product patch
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          source_sha = os.environ["SOURCE_SHA"]
          row_count = int(os.environ["ROW_COUNT"])
          rows = []
          for trigger in (
              "open-close",
              "select-one",
              "indexed-read",
              "explicit-checkpoint",
          ):
              triggered = json.loads(pathlib.Path(f"trigger-{trigger}.json").read_text())
              inspected = json.loads(pathlib.Path(f"inspection-{trigger}.json").read_text())
              require(triggered.get("schema_version") == 1, f"{trigger}: bad trigger schema")
              require(inspected.get("schema_version") == 1, f"{trigger}: bad inspection schema")
              require(triggered.get("trigger") == trigger, f"{trigger}: trigger mismatch")
              require(
                  triggered.get("source_sha") == source_sha
                  and inspected.get("source_sha") == source_sha,
                  f"{trigger}: source mismatch",
              )
              writer = triggered["writer_library"]
              engine = triggered["trigger_library"]
              require(writer["sha256"] == engine["sha256"], f"{trigger}: library bytes differ")
              require(
                  (writer["device"], writer["inode"])
                  != (engine["device"], engine["inode"]),
                  f"{trigger}: library inodes are not distinct",
              )
              require(
                  writer["open_address"] != engine["open_address"],
                  f"{trigger}: engine function addresses are not distinct",
              )
              require(
                  triggered["wal_before_trigger"]["present"] is True,
                  f"{trigger}: missing pre-trigger WAL",
              )
              require(
                  inspected["full_count"] == row_count,
                  f"{trigger}: full table count changed",
              )
              require(
                  inspected["first_values"] == list(range(1, row_count + 1)),
                  f"{trigger}: ordered values changed",
              )
              require(
                  inspected["disabled_filtered_count"] == 1
                  and inspected["disabled_terminal_count"] == 1,
                  f"{trigger}: sequential-scan controls failed",
              )
              wrong_result = (
                  inspected["enabled_filtered_count"] != 1
                  or inspected["enabled_terminal_count"] != 1
                  or inspected["full_count"] != row_count
              )
              rows.append(
                  {
                      "trigger": trigger,
                      "sql": triggered["trigger_observation"]["sql"],
                      "trigger_scalar": triggered["trigger_observation"]["scalar"],
                      "wal_before": triggered["wal_before_trigger"],
                      "wal_after": triggered["wal_after_trigger"],
                      "enabled_filtered_count": inspected["enabled_filtered_count"],
                      "enabled_terminal_count": inspected["enabled_terminal_count"],
                      "disabled_filtered_count": inspected["disabled_filtered_count"],
                      "disabled_terminal_count": inspected["disabled_terminal_count"],
                      "full_count": inspected["full_count"],
                      "wrong_result": wrong_result,
                  }
              )

          first_losing = next((row["trigger"] for row in rows if row["wrong_result"]), None)
          summary = {
              "schema_version": 1,
              "source_sha": source_sha,
              "row_count": row_count,
              "first_losing_trigger_in_test_order": first_losing,
              "rows": rows,
              "attribution_rule": "Only the named operation in each fresh row may own that row; explicit-checkpoint means SQL CHECKPOINT was executed.",
          }
          pathlib.Path("trigger-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload current trigger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secondary-art-current-trigger-matrix
          path: |
            current-source.json
            current-library-resolution.json
            current-library-resolution.stdout
            current-libraries.sha256
            current-runtime.txt
            trigger-*.json
            inspection-*.json
            trigger-summary.json
            secondary-art-trigger-*.duckdb
            secondary-art-trigger-*.duckdb.wal
          if-no-files-found: warn
          retention-days: 14
