name: Fieldwork secondary ART checkpoint probe

on:
  pull_request:
    paths:
      - '.github/workflows/fieldwork-secondary-art-checkpoint.yml'
      - 'tools/fieldwork/secondary_art_checkpoint_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.3.2'
            expected_probe_status: 1
            expected_index_count: 1
          - version: '1.5.4'
            expected_probe_status: 0
            expected_index_count: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matching Python package and C library
        env:
          VERSION: ${{ matrix.version }}
        run: |
          python -m pip install --disable-pip-version-check "duckdb==$VERSION"
          curl --fail --location --retry 3 \
            --output libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/v$VERSION/libduckdb-linux-amd64.zip"
          mkdir libduckdb
          unzip -q libduckdb.zip -d libduckdb
          find libduckdb -maxdepth 2 -type f -print
      - name: Run independent-engine checkpoint probe
        env:
          EXPECTED_STATUS: ${{ matrix.expected_probe_status }}
        run: |
          LIBRARY=$(find libduckdb -type f -name 'libduckdb.so' -print -quit)
          test -n "$LIBRARY"
          set +e
          python tools/fieldwork/secondary_art_checkpoint_probe.py \
            "$LIBRARY" "$PWD/secondary-art-${{ matrix.version }}.duckdb" \
            | tee "probe-${{ matrix.version }}.json"
          status=${PIPESTATUS[0]}
          set -e
          echo "probe_status=$status" | tee "probe-status-${{ matrix.version }}.txt"
          test "$status" -eq "$EXPECTED_STATUS"
      - name: Inspect persisted file in a fresh client
        env:
          EXPECTED_INDEX_COUNT: ${{ matrix.expected_index_count }}
          VERSION: ${{ matrix.version }}
        run: |
          python - <<'PY' | tee "inspection-${{ matrix.version }}.json"
          import duckdb
          import json
          import os

          path = f"secondary-art-{os.environ['VERSION']}.duckdb"
          connection = duckdb.connect(path, read_only=True)
          indexed = connection.execute(
              "SELECT count(*) FROM t WHERE a = 1"
          ).fetchone()[0]
          full = connection.execute("SELECT count(*) FROM t").fetchone()[0]
          plan = connection.execute(
              "EXPLAIN SELECT count(*) FROM t WHERE a = 1"
          ).fetchall()
          connection.close()
          record = {
              "version": duckdb.__version__,
              "indexed_count": indexed,
              "full_count": full,
              "plan": plan,
          }
          print(json.dumps(record, sort_keys=True))
          assert indexed == int(os.environ["EXPECTED_INDEX_COUNT"]), record
          assert full == 2, record
          PY
      - name: Upload exact database and results
        uses: actions/upload-artifact@v4
        with:
          name: secondary-art-${{ matrix.version }}
          path: |
            secondary-art-${{ matrix.version }}.duckdb
            secondary-art-${{ matrix.version }}.duckdb.wal
            probe-${{ matrix.version }}.json
            probe-status-${{ matrix.version }}.txt
            inspection-${{ matrix.version }}.json
          if-no-files-found: error
