name: Fieldwork issue 55 file-sink publication

on:
  push:
    branches:
      - fieldwork/55-file-sink-publication
  pull_request:
    paths:
      - tools/fieldwork/issue55_file_sink_probe.py
      - tools/fieldwork/issue55_file_sink_probe_v2.py
      - tools/fieldwork/issue55_crash_threshold_probe.py
      - tools/fieldwork/issue55_tmp_publication_probe.py
      - tools/fieldwork/requirements-issue55.txt
      - .github/workflows/fieldwork-issue55-file-sink.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/fieldwork/requirements-issue55.txt
      - name: Install pinned DuckDB client
        run: python -m pip install --require-hashes -r tools/fieldwork/requirements-issue55.txt
      - name: Run broad publication matrix
        run: python tools/fieldwork/issue55_file_sink_probe_v2.py --output issue55-results-v2.json
      - name: Run exact-threshold crash control
        run: python tools/fieldwork/issue55_crash_threshold_probe.py --output issue55-crash-threshold.json
      - name: Run temporary-file publication matrix
        run: python tools/fieldwork/issue55_tmp_publication_probe.py --output issue55-tmp-publication.json
      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldwork-issue55-results-v4
          path: |
            issue55-results-v2.json
            issue55-crash-threshold.json
            issue55-tmp-publication.json
          if-no-files-found: error
          retention-days: 30
