name: Fieldwork C API Arrow multi-column ownership characterization

on:
  pull_request:
    branches:
      - fieldwork/capi-arrow-multicolumn-ownership-exec-base
    paths:
      - '.github/workflows/fieldwork-capi-arrow-multicolumn-ownership.yml'
      - 'test/api/capi/CMakeLists.txt'
      - 'test/api/capi/test_capi_arrow_ownership.cpp'

permissions:
  contents: read

concurrency:
  group: fieldwork-capi-arrow-multicolumn-ownership-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact characterization head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify private characterization fence
        env:
          TARGET_SOURCE: e500d77864fe565f90e68f06d729c25b11e775c5
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git merge-base HEAD "$TARGET_SOURCE")" = "$TARGET_SOURCE"
          git diff --check "$BASE_SHA...HEAD_SHA"
          git diff --name-only "$BASE_SHA...HEAD_SHA" | sort | tee /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          test/api/capi/CMakeLists.txt
          test/api/capi/test_capi_arrow_ownership.cpp
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq mold ninja-build

      - name: Build debug test runner
        run: |
          set -euo pipefail
          mkdir -p receipt
          GEN=ninja make debug 2>&1 | tee receipt/build.log

      - name: Run ownership characterization
        run: |
          set -euo pipefail
          build/debug/test/unittest "C API Arrow chunk retains multi-column root ownership" \
            2>&1 | tee receipt/characterization.log

      - name: Upload characterization receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: capi-arrow-multicolumn-ownership-characterization
          path: receipt/
          if-no-files-found: warn
          retention-days: 30
