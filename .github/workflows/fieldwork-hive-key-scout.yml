name: Fieldwork Hive partition key scout

on:
  push:
    branches:
      - fieldwork/hive-key-scout-b3062a5
  pull_request:
    branches:
      - fieldwork/base-duckdb-b3062a5-clean
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldwork-hive-key-scout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE_SHA: b3062a5e82f50d77ff6e1006a36f645a79bc4936
      GEN: ninja
    steps:
      - name: Check out scout head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Verify exact base and scout fence
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD
          git diff --name-only "$BASE_SHA" HEAD | sort

      - name: Install build dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ninja-build libcurl4-openssl-dev

      - name: Configure DuckDB with Parquet and HTTPFS
        run: |
          cmake -S . -B build/hive-key-scout -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_EXTENSIONS='parquet;httpfs' \
            -DFORCE_COLORED_OUTPUT=1

      - name: Build CLI and native test runner
        run: cmake --build build/hive-key-scout --target duckdb unittest --parallel 2

      - name: Confirm existing escape regression
        run: ./build/hive-key-scout/test/run 'test/sql/copy/partitioned/hive_partition_escape.test'

      - name: Capture writer-produced escaped-key failure
        shell: bash
        run: |
          set +e
          ./build/hive-key-scout/test/run \
            'test/sql/copy/partitioned/hive_partition_key_roundtrip.test' \
            > /tmp/hive-key-roundtrip.log 2>&1
          status=$?
          set -e
          cat /tmp/hive-key-roundtrip.log
          test "$status" -ne 0
          grep -F 'Referenced column "=/ \\/" not found' /tmp/hive-key-roundtrip.log

      - name: Characterize external key spellings and repetition
        shell: bash
        run: |
          set -euxo pipefail
          CLI=./build/hive-key-scout/duckdb
          ROOT=/tmp/duckdb-hive-key-scout
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          "$CLI" -c "COPY (SELECT 1 AS id) TO '$ROOT/base.parquet' (FORMAT PARQUET);"

          mkdir -p "$ROOT/raw-encoded/a=one/%61=two"
          cp "$ROOT/base.parquet" "$ROOT/raw-encoded/a=one/%61=two/data.parquet"
          actual=$("$CLI" -csv -noheader -c \
            "SELECT a, \"%61\", id FROM parquet_scan('$ROOT/raw-encoded/**/*.parquet', hive_partitioning=1);")
          test "$actual" = 'one,two,1'

          mkdir -p "$ROOT/repeated/a=first/a=second"
          cp "$ROOT/base.parquet" "$ROOT/repeated/a=first/a=second/data.parquet"
          actual=$("$CLI" -csv -noheader -c \
            "SELECT a, id FROM parquet_scan('$ROOT/repeated/**/*.parquet', hive_partitioning=1);")
          test "$actual" = 'first,1'

          mkdir -p "$ROOT/malformed/%ZZ=value"
          cp "$ROOT/base.parquet" "$ROOT/malformed/%ZZ=value/data.parquet"
          actual=$("$CLI" -csv -noheader -c \
            "SELECT \"%ZZ\", id FROM parquet_scan('$ROOT/malformed/**/*.parquet', hive_partitioning=1);")
          test "$actual" = 'value,1'

      - name: Probe URL query-fragment slash reset end to end
        shell: bash
        run: |
          set -euxo pipefail
          CLI=./build/hive-key-scout/duckdb
          ROOT=/tmp/duckdb-hive-key-http
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          "$CLI" -c "COPY (SELECT 7 AS id) TO '$ROOT/data.parquet' (FORMAT PARQUET);"
          python3 -m http.server 8123 --bind 127.0.0.1 --directory "$ROOT" \
            > /tmp/hive-key-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          sleep 2

          control=$("$CLI" -csv -noheader -c \
            "LOAD httpfs; SELECT id FROM parquet_scan('http://127.0.0.1:8123/data.parquet?p=value', hive_partitioning=1);")
          test "$control" = '7'

          phantom=$("$CLI" -csv -noheader -c \
            "LOAD httpfs; SELECT p, id FROM parquet_scan('http://127.0.0.1:8123/data.parquet?redirect=/p=value/file', hive_partitioning=1);")
          test "$phantom" = 'value,7'

          cat /tmp/hive-key-http.log
