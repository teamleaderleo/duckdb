name: Fieldwork unit 04 current-main owner review

on:
  push:
    branches:
      - fieldwork/unit04-owner-review-execution-1c931ed
  pull_request:
    branches:
      - upstream/04-hive-default-partition-marker
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fieldwork-unit04-owner-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HISTORICAL_BASE: 81fcce7fa76a320dc65be54cb0825e5315ac6f5b
      HISTORICAL_SOURCE: 1c931ed41822f0e27d66afb636be2730695dcf8d
      CURRENT_MAIN: daa81697e31a3dc97a93f11220037cd2213af6cd
      SOURCE_BRANCH: candidate/04-hive-default-marker-current-main
      GEN: ninja
    steps:
      - name: Check out exact current public main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CURRENT_MAIN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize exact accepted two-file patch
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$CURRENT_MAIN"
          mkdir -p receipt
          git diff --binary "$HISTORICAL_BASE" "$HISTORICAL_SOURCE" -- \
            src/execution/operator/persistent/physical_copy_to_file.cpp \
            test/sql/copy/parquet/parquet_hive_default_collision.test \
            > receipt/historical-source.patch
          test -s receipt/historical-source.patch
          git apply --check --3way receipt/historical-source.patch
          git apply --3way receipt/historical-source.patch
          git diff --check
          {
            git diff --name-only
            git ls-files --others --exclude-standard | grep -v '^receipt/' || true
          } | sort -u > receipt/actual-files.txt
          printf '%s\n' \
            src/execution/operator/persistent/physical_copy_to_file.cpp \
            test/sql/copy/parquet/parquet_hive_default_collision.test \
            | sort > receipt/expected-files.txt
          diff -u receipt/expected-files.txt receipt/actual-files.txt
          git diff --binary -- \
            src/execution/operator/persistent/physical_copy_to_file.cpp \
            test/sql/copy/parquet/parquet_hive_default_collision.test \
            > receipt/current-main-source.patch
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add \
            src/execution/operator/persistent/physical_copy_to_file.cpp \
            test/sql/copy/parquet/parquet_hive_default_collision.test
          git commit -m 'fix(parquet): preserve literal Hive default-partition marker'
          {
            echo "historical_base=$HISTORICAL_BASE"
            echo "historical_source=$HISTORICAL_SOURCE"
            echo "current_main=$CURRENT_MAIN"
            echo "tested_source=$(git rev-parse HEAD)"
            echo "source_branch=$SOURCE_BRANCH"
          } > receipt/identity.txt

      - name: Install build and generation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ninja-build
          make generate-files-deps 2>&1 | tee receipt/generate-files-deps.log

      - name: Run repository prepare and generated-file gates
        shell: bash
        run: |
          set -euo pipefail
          make test_ci 2>&1 | tee receipt/test-ci.log
          make -j4 format_tools 2>&1 | tee receipt/format-tools.log
          make format-check-silent enum-integrity-check extension-patch-check -j2 -Otarget \
            2>&1 | tee receipt/source-gates.log
          make generate-files 2>&1 | tee receipt/generate-files.log
          git diff --exit-code

      - name: Configure native debug build with Parquet
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/unit04-owner-review -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_EXTENSIONS=parquet \
            -DFORCE_COLORED_OUTPUT=1 \
            2>&1 | tee receipt/configure.log

      - name: Build native test runner
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/unit04-owner-review --target unittest --parallel 2 \
            2>&1 | tee receipt/build.log

      - name: Run focused unit 04 regression
        shell: bash
        run: |
          set -o pipefail
          ./build/unit04-owner-review/test/run \
            'test/sql/copy/parquet/parquet_hive_default_collision.test' \
            2>&1 | tee receipt/focused.log

      - name: Run complete native unit-test runner
        shell: bash
        run: |
          set -o pipefail
          ./build/unit04-owner-review/test/run \
            2>&1 | tee receipt/complete.log

      - name: Publish exact current-main two-file source
        shell: bash
        run: |
          set -euxo pipefail
          git diff --exit-code
          expected=$(cat receipt/expected-files.txt)
          actual=$(git diff --name-only "$CURRENT_MAIN..HEAD" | sort)
          test "$actual" = "$expected"
          git checkout -B "$SOURCE_BRANCH"
          git push --force-with-lease origin "HEAD:refs/heads/$SOURCE_BRANCH"

      - name: Upload exact receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: fieldwork-unit-04-current-main
          path: receipt/
          if-no-files-found: warn
          retention-days: 30
