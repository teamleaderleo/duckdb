name: Fieldwork Hive default-partition literal candidate

on:
  push:
    branches:
      - fieldwork/hive-default-partition-literal-escape
    paths:
      - '.github/workflows/fieldwork-hive-default-partition-literal.yml'
  pull_request:
    paths:
      - '.github/workflows/fieldwork-hive-default-partition-literal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldwork-hive-default-partition-literal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Materialize exact candidate and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/execution/operator/persistent/physical_copy_to_file.cpp')
          text = source.read_text(encoding='utf-8')
          old = '''\t\t\tif (partition_value.IsNull()) {
\t\t\t\tp_dir += "__HIVE_DEFAULT_PARTITION__";
\t\t\t} else {
\t\t\t\tp_dir += HivePartitioning::Escape(partition_value.ToString());
\t\t\t}
'''
          new = '''\t\t\tif (partition_value.IsNull()) {
\t\t\t\tp_dir += "__HIVE_DEFAULT_PARTITION__";
\t\t\t} else {
\t\t\t\tauto partition_text = partition_value.ToString();
\t\t\t\tauto escaped_partition_text = HivePartitioning::Escape(partition_text);
\t\t\t\tif (partition_text == "__HIVE_DEFAULT_PARTITION__") {
\t\t\t\t\tescaped_partition_text = "%5F%5FHIVE_DEFAULT_PARTITION%5F%5F";
\t\t\t\t}
\t\t\t\tp_dir += escaped_partition_text;
\t\t\t}
'''
          if text.count(old) != 1:
              raise SystemExit(f'partition directory anchor moved: {text.count(old)} matches')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('test/sql/copy/parquet/parquet_hive_null.test')
          test_text = tests.read_text(encoding='utf-8')
          marker = '''query I
select count(*) from glob('{TEST_DIR}/hive-null-write-test/a=__HIVE_DEFAULT_PARTITION__/b=__HIVE_DEFAULT_PARTITION__/*.parquet');
----
1
'''
          addition = marker + '''

# Test that the literal reserved marker and SQL NULL use distinct partitions
statement ok
CREATE TABLE test_hive_reserved_marker_collision AS
SELECT * FROM (VALUES ('__HIVE_DEFAULT_PARTITION__', 1), (NULL, 2)) v(p, id);

statement ok
COPY test_hive_reserved_marker_collision TO '{TEST_DIR}/hive-reserved-marker-collision'
(FORMAT PARQUET, PARTITION_BY (p), OVERWRITE);

query III
SELECT (p IS NULL)::INTEGER AS is_null, p, id
FROM parquet_scan('{TEST_DIR}/hive-reserved-marker-collision/**/*.parquet', hive_partitioning=1)
ORDER BY id
----
0	__HIVE_DEFAULT_PARTITION__	1
1	NULL	2

query I
SELECT count(*)
FROM glob('{TEST_DIR}/hive-reserved-marker-collision/p=__HIVE_DEFAULT_PARTITION__/*.parquet');
----
1

query I
SELECT count(*)
FROM glob('{TEST_DIR}/hive-reserved-marker-collision/p=%5F%5FHIVE_DEFAULT_PARTITION%5F%5F/*.parquet');
----
1
'''
          if test_text.count(marker) != 1:
              raise SystemExit(f'parquet hive-null test anchor moved: {test_text.count(marker)} matches')
          tests.write_text(test_text.replace(marker, addition, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- src/execution/operator/persistent/physical_copy_to_file.cpp test/sql/copy/parquet/parquet_hive_null.test

      - name: Install build dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ninja-build

      - name: Configure focused DuckDB build
        run: |
          cmake -S . -B build/fieldwork-hive-marker -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_EXTENSIONS=parquet \
            -DFORCE_COLORED_OUTPUT=1

      - name: Build native test runner
        run: cmake --build build/fieldwork-hive-marker --target unittest --parallel 2

      - name: Run affected SQLLogic test
        run: |
          set -o pipefail
          ./build/fieldwork-hive-marker/test/unittest \
            'test/sql/copy/parquet/parquet_hive_null.test' \
            2>&1 | tee fieldwork-hive-default-partition-literal.log

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldwork-hive-default-partition-literal
          path: fieldwork-hive-default-partition-literal.log
          if-no-files-found: warn
          retention-days: 30
