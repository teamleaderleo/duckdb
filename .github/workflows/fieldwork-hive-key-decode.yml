name: Fieldwork Hive partition key decode

on:
  push:
    branches:
      - fieldwork/hive-key-decode-b3062a5
  pull_request:
    branches:
      - fieldwork/base-duckdb-b3062a5-clean
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldwork-hive-key-decode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE_SHA: b3062a5e82f50d77ff6e1006a36f645a79bc4936
      GEN: ninja
    steps:
      - name: Check out candidate carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Materialize candidate source
        shell: bash
        run: |
          set -euxo pipefail
          cp fieldwork/hive_partition_key_decode.patch /tmp/hive-key.patch
          cp test/sql/copy/partitioned/hive_partition_key_roundtrip.test /tmp/hive-key.test
          git reset --hard "$BASE_SHA"
          rm -rf build
          git apply --check /tmp/hive-key.patch
          git apply /tmp/hive-key.patch
          cp /tmp/hive-key.test test/sql/copy/partitioned/hive_partition_key_roundtrip.test
          git diff --check
          git diff --name-only "$BASE_SHA" | sort

      - name: Install build dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ninja-build libcurl4-openssl-dev

      - name: Run repository preparation and formatting gates
        run: |
          make test_ci
          make -j4 format_tools
          make format-check-silent enum-integrity-check extension-patch-check -j2 -Otarget
          make generate-files
          git diff --exit-code -- . ':!src/common/hive_partitioning.cpp' ':!test/sql/copy/partitioned/hive_partition_escape.test' ':!test/sql/copy/partitioned/hive_partition_key_roundtrip.test'

      - name: Configure DuckDB with Parquet and HTTPFS
        run: |
          cmake -S . -B build/hive-key-decode -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_EXTENSIONS='parquet;httpfs' \
            -DFORCE_COLORED_OUTPUT=1

      - name: Build CLI and native test runner
        run: cmake --build build/hive-key-decode --target duckdb unittest --parallel 2

      - name: Run existing escape regression
        run: ./build/hive-key-decode/test/run 'test/sql/copy/partitioned/hive_partition_escape.test'

      - name: Run key round-trip matrix
        run: ./build/hive-key-decode/test/run 'test/sql/copy/partitioned/hive_partition_key_roundtrip.test'

      - name: Characterize Hive-style external key decoding
        shell: bash
        run: |
          set -euxo pipefail
          CLI=./build/hive-key-decode/duckdb
          ROOT=/tmp/duckdb-hive-key-external
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          "$CLI" -c "COPY (SELECT 1 AS id) TO '$ROOT/base.parquet' (FORMAT PARQUET);"

          mkdir -p "$ROOT/noncanonical/%61=one"
          cp "$ROOT/base.parquet" "$ROOT/noncanonical/%61=one/data.parquet"
          actual=$("$CLI" -csv -noheader -c \
            "SELECT a, id FROM parquet_scan('$ROOT/noncanonical/**/*.parquet', hive_partitioning=1);")
          test "$actual" = 'one,1'

          mkdir -p "$ROOT/malformed/%ZZ=two"
          cp "$ROOT/base.parquet" "$ROOT/malformed/%ZZ=two/data.parquet"
          actual=$("$CLI" -csv -noheader -c \
            "SELECT \"%ZZ\", id FROM parquet_scan('$ROOT/malformed/**/*.parquet', hive_partitioning=1);")
          test "$actual" = 'two,1'

          mkdir -p "$ROOT/invalid/%FF=three"
          cp "$ROOT/base.parquet" "$ROOT/invalid/%FF=three/data.parquet"
          set +e
          "$CLI" -c "FROM parquet_scan('$ROOT/invalid/**/*.parquet', hive_partitioning=1);" \
            > /tmp/invalid-key.log 2>&1
          status=$?
          set -e
          cat /tmp/invalid-key.log
          test "$status" -ne 0
          grep -F 'decoded value is invalid UTF8' /tmp/invalid-key.log

          mkdir -p "$ROOT/repeated/a=first/a=second"
          cp "$ROOT/base.parquet" "$ROOT/repeated/a=first/a=second/data.parquet"
          actual=$("$CLI" -csv -noheader -c \
            "SELECT a, id FROM parquet_scan('$ROOT/repeated/**/*.parquet', hive_partitioning=1);")
          test "$actual" = 'first,1'

          mkdir -p "$ROOT/raw-encoded/a=first/%61=second"
          cp "$ROOT/base.parquet" "$ROOT/raw-encoded/a=first/%61=second/data.parquet"
          actual=$("$CLI" -csv -noheader -c \
            "SELECT a, id FROM parquet_scan('$ROOT/raw-encoded/**/*.parquet', hive_partitioning=1);")
          test "$actual" = 'first,1'

      - name: Keep query-fragment probe independent
        shell: bash
        run: |
          set -euxo pipefail
          CLI=./build/hive-key-decode/duckdb
          ROOT=/tmp/duckdb-hive-key-http
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          "$CLI" -c "COPY (SELECT 7 AS id) TO '$ROOT/data.parquet' (FORMAT PARQUET);"
          python3 -m http.server 8123 --bind 127.0.0.1 --directory "$ROOT" \
            > /tmp/hive-key-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          sleep 2
          phantom=$("$CLI" -csv -noheader -c \
            "LOAD httpfs; SELECT p, id FROM parquet_scan('http://127.0.0.1:8123/data.parquet?redirect=/p=value/file', hive_partitioning=1);")
          test "$phantom" = 'value,7'
          cat /tmp/hive-key-http.log
